[project]
name = "claude-code-ops-audit"
version = "0.1.1"
description = "Methods and tools for auditing Claude Code session logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Isaac" }]
dependencies = []

[project.optional-dependencies]
audit = ["anthropic>=0.116,<2"]

[dependency-groups]
dev = [
  "anthropic>=0.116,<2",
  "duckdb>=1.5,<2",
  "mypy>=1.19,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["audit"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
